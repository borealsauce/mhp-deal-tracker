<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>MHP Deal Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,650;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css?v=20261124g">
</head>
<body class="card-m">
  <header class="top">
    <h1>MHP Deal Tracker</h1>
    <div class="sub" id="asof"></div>
    <div class="counts" id="hdr-counts"></div>
  </header>

  <div class="toolbar">
    <div class="tabs" role="tablist">
      <button type="button" class="tab" data-tab="all_qualified">Qualified <span class="n" id="n-all">0</span></button>
      <button type="button" class="tab" data-tab="seller_financing">Seller financing <span class="n" id="n-sf">0</span></button>
      <button type="button" class="tab" data-tab="other_passes">Other passes <span class="n" id="n-pass">0</span></button>
      <button type="button" class="tab" data-tab="missing_info">Missing info — chase broker <span class="n" id="n-miss">0</span></button>
      <button type="button" class="tab" data-tab="crexi_saved">Crexi Saved <span class="n" id="n-saved">0</span></button>
    </div>
    <div class="filters">
      <input id="q" type="search" placeholder="Search parks, cities, notes…">
      <label>State
        <select id="state"><option value="">All states</option></select>
      </label>
      <label id="savedGroupWrap" hidden>Group
        <select id="savedGroup">
          <option value="MHP" selected>MHP</option>
          <option value="Gas stations NNN">Gas stations NNN</option>
          <option value="">All saved</option>
        </select>
      </label>
      <label>Min price <input id="pmin" type="number" min="0" step="50000" placeholder="800000"></label>
      <label>Max price <input id="pmax" type="number" min="0" step="50000" placeholder="3800000"></label>
      <label class="chk"><input id="onlyNew" type="checkbox"> New only</label>
      <span id="shown" class="sort-mode"></span>
      <div class="actions">
        <button type="button" class="btn" id="viewCards">Cards</button>
        <button type="button" class="btn" id="viewTable">Table</button>
        <button type="button" class="btn" id="modeMulti">Multi-sort</button>
        <button type="button" class="btn" id="modeSingle">Single sort</button>
        <button type="button" class="btn ghost" id="clearSorts">Clear sorts</button>
        <button type="button" class="btn ghost" id="exportCsv">Export CSV</button>
        <button type="button" class="btn ghost" id="deleteSelected">Delete selected</button>
        <button type="button" class="btn ghost" id="showDeleted">Show deleted (0)</button>
        <button type="button" class="btn ghost" id="exportNotes">Export notes</button>
        <button type="button" class="btn ghost" id="importNotes">Import notes</button>
        <input type="file" id="importNotesFile" accept="application/json,.json" hidden>
        <span class="seg" id="cardSizeWrap" title="Card size">
          <span class="seg-label">Cards</span>
          <button type="button" class="btn size" data-card-size="s">S</button>
          <button type="button" class="btn size" data-card-size="m">M</button>
          <button type="button" class="btn size" data-card-size="l">L</button>
        </span>
        <label class="map-width-ctrl" id="mapWidthWrap" title="Width of the map on the right">
          <span class="seg-label">Map</span>
          <input type="range" id="mapWidth" min="20" max="70" step="1" aria-label="Map width">
        </label>
      </div>
    </div>
    <div class="sort-bar" id="sortBar"></div>
  </div>

  <div id="toast" class="toast" hidden>
    <span id="toastMsg"></span>
    <button type="button" class="btn" id="toastUndo">Undo</button>
  </div>

  <div class="split" id="split">
    <div class="list-pane" id="list"></div>
    <div class="map-pane">
      <div id="map"></div>
      <div class="map-legend">
        <div><i class="dot" style="background:#12875A"></i>Seller financing</div>
        <div><i class="dot" style="background:#2B6CB0"></i>Other passes</div>
        <div><i class="dot" style="background:#C05621"></i>Missing info — chase broker</div>
        <div><i class="dot" style="background:#12875A"></i>Crexi saved — MHP</div>
        <div><i class="dot" style="background:#6B4C9A"></i>Crexi saved — NNN</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js?v=20261124g"></script>
</body>
</html>
